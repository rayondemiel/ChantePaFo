services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chantepafo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chantepafo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-chantepafo}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

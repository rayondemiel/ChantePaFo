services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-chantepafo_dev}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chantepafo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chantepafo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-chantepafo}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis-exporter:
    image: oliver006/redis_exporter:latest
    ports:
      - "127.0.0.1:${REDIS_EXPORTER_PORT:-9121}:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-chantepafo_dev}
    depends_on:
      - redis

volumes:
  pgdata:
